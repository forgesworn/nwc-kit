name: bootstrap first npm release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-first-npm-release
  cancel-in-progress: false

jobs:
  build-a:
    if: github.repository == 'forgesworn/nwc-kit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.record.outputs.sha256 }}
    env:
      ACTION_SRC: .anvil
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: forgesworn/anvil
          ref: d4294e622932d93957d73e5b1af0267382b6af04 # v0.10.1
          path: ${{ env.ACTION_SRC }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run prepublishOnly
      - run: npm run test:protocol
      - name: Verify release action pins
        env:
          STRICT_ACTION_PINS: '1'
        run: $ACTION_SRC/steps/verify-action-pins.sh
      - name: Verify runtime audit
        env:
          AUDIT_LEVEL: low
        run: $ACTION_SRC/steps/verify-audit.sh
      - name: Verify exports
        run: $ACTION_SRC/steps/verify-exports.sh
      - name: Verify exact pack set contains no secret markers
        run: $ACTION_SRC/steps/verify-secrets.sh
      - name: Refuse install-time lifecycle hooks
        env:
          LIFECYCLE_POLICY: strict
          ALLOWED_LIFECYCLE_SCRIPTS: '{}'
        run: $ACTION_SRC/steps/verify-lifecycle-scripts.sh
      - name: Record exact tarball
        id: record
        env:
          TARBALL_META_DIR: ${{ runner.temp }}/nwc-kit-bootstrap-a
        run: |
          $ACTION_SRC/steps/record-tarball.sh
          sha256="$(grep '^sha256=' "$TARBALL_META_DIR/tarball.meta" | cut -d= -f2-)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nwc-kit-bootstrap-a
          path: ${{ runner.temp }}/nwc-kit-bootstrap-a
          retention-days: 1
          if-no-files-found: error

  build-b:
    if: github.repository == 'forgesworn/nwc-kit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.record.outputs.sha256 }}
    env:
      ACTION_SRC: .anvil
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: forgesworn/anvil
          ref: d4294e622932d93957d73e5b1af0267382b6af04 # v0.10.1
          path: ${{ env.ACTION_SRC }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Record independent tarball
        id: record
        env:
          TARBALL_META_DIR: ${{ runner.temp }}/nwc-kit-bootstrap-b
        run: |
          $ACTION_SRC/steps/record-tarball.sh
          sha256="$(grep '^sha256=' "$TARBALL_META_DIR/tarball.meta" | cut -d= -f2-)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build-a, build-b]
    if: github.repository == 'forgesworn/nwc-kit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm-bootstrap
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nwc-kit-bootstrap-a
          path: ${{ runner.temp }}/nwc-kit-bootstrap-a
      - name: Verify reproducibility and registry state
        env:
          SHA_A: ${{ needs.build-a.outputs.sha256 }}
          SHA_B: ${{ needs.build-b.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ -n "$SHA_A" && "$SHA_A" == "$SHA_B" ]] || {
            echo "::error::independent tarballs differ: A=$SHA_A B=$SHA_B"
            exit 1
          }
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          echo "bootstrapping $name@$version"
          if npm view "$name@$version" version > /dev/null 2>registry-error.txt; then
            echo "::error::$name@$version already exists; bootstrap is one-shot"
            exit 1
          fi
          grep -Eq 'E404|is not in this registry|code E404' registry-error.txt || {
            cat registry-error.txt >&2
            echo "::error::cannot prove that $version is absent from npm"
            exit 1
          }
      - name: Publish the verified first release with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          tarball="$(find '${{ runner.temp }}/nwc-kit-bootstrap-a' -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          [[ -n "$tarball" ]] || { echo '::error::verified tarball is missing'; exit 1; }
          npm publish --ignore-scripts --provenance --access public "$tarball"
