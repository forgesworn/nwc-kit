name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:site
      - name: No Node imports in browser-safe source
        run: npm run check:no-node-imports
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:browser-bundle
      - name: Demo site still builds
        run: npm run build:site
      - name: Committed site output is up to date
        run: git diff --exit-code -- docs
      - run: npm run check:pack
      - name: No known dependency vulnerabilities
        run: npm audit

